<!DOCTYPE html>
<html>
  <head>
    <title>Heart & Body WebAR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <style>
      #labelLayer {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
      }
      .audio-label {
        position: absolute;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 8px 12px;
        border: 2px solid currentColor;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 2px 8px #0004;
        font: 600 14px/1.2 'Segoe UI', sans-serif;
        white-space: nowrap;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        touch-action: manipulation;
        cursor: pointer;
      }
      .audio-label[hidden] { display: none; }
      .audio-label:focus-visible { outline: 3px solid #00ffe1; outline-offset: 3px; }
      .audio-label svg { width: 18px; height: 18px; flex: none; }

      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #000;
      }

      #startOverlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(135deg, #141e30, #243b55);
        color: white;
        font-size: 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        text-align: center;
        padding: 30px 20px;
        box-sizing: border-box;
        animation: fadeIn 1s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: scale(1.05); }
        to { opacity: 1; transform: scale(1); }
      }

      #startOverlay h1 {
        font-size: 36px;
        margin-bottom: 24px;
        color: #00ffe1;
      }

      #startOverlay p {
        margin: 10px 0;
        line-height: 1.6;
        color: #dddddd;
        max-width: 300px;
      }

      .start-button {
        margin-top: 30px;
        padding: 14px 32px;
        font-size: 18px;
        font-weight: bold;
        background-color: #00ffe1;
        color: #000;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0, 255, 225, 0.4);
      }
      .list-button {
        background-color: #00ffe1;
        color: #000;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0, 255, 225, 0.4);
      }

      .start-button:hover {
        background-color: #00cbb9;
        transform: scale(1.05);
        box-shadow: 0 6px 14px rgba(0, 255, 225, 0.5);
      }
    </style>
    <script>
      const trackedMarkers = { customMarker: false, heartMarker: false };
      let experienceStarted = false;
      let activeNarration = null;
      let playbackRequest = 0;

      function setAudioStatus(message) {
        const status = document.getElementById('audioStatus');
        status.textContent = message;
        status.hidden = !message;
      }

      function stopNarration(markerId) {
        if (!activeNarration || (markerId && activeNarration.markerId !== markerId)) return;
        const previous = activeNarration.audio;
        activeNarration = null;
        playbackRequest += 1;
        previous.pause();
        previous.currentTime = 0;
        setAudioStatus('');
      }

      function playMarkerAudio(audioId, markerId) {
        if (!trackedMarkers[markerId]) return;
        const audio = document.getElementById(audioId);
        if (!audio) return;
        stopNarration();
        const request = ++playbackRequest;
        activeNarration = { audio, markerId };
        audio.currentTime = 0;
        setAudioStatus('');
        // Called directly from the label click so playback has a user gesture.
        audio.play().catch(() => {
          if (request !== playbackRequest) return;
          activeNarration = null;
          setAudioStatus('Audio could not play. Check your connection and tap the label again.');
        });
      }

      function showMarkerInstructions() {
        alert('Point your camera at the matching heart or body marker.');
      }

      document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('startButton').addEventListener('click', function () {
        document.getElementById('startOverlay').style.display = 'none';
        experienceStarted = true;
      });


        // Body Marker Events
        const bodyMarker = document.getElementById('customMarker');
        const markerBody = document.getElementById('markerBody');

        bodyMarker.addEventListener('markerFound', () => {
          trackedMarkers.customMarker = true;
          markerBody.setAttribute('visible', true);
        });

        bodyMarker.addEventListener('markerLost', () => {
          trackedMarkers.customMarker = false;
          stopNarration('customMarker');
          markerBody.setAttribute('visible', false);
        });

        // Heart Marker Events
        const heartMarker = document.getElementById('heartMarker');
        const markerHeart = document.getElementById('markerHeart');

        heartMarker.addEventListener('markerFound', () => {
          trackedMarkers.heartMarker = true;
          markerHeart.setAttribute('visible', true);
        });

        heartMarker.addEventListener('markerLost', () => {
          trackedMarkers.heartMarker = false;
          stopNarration('heartMarker');
          markerHeart.setAttribute('visible', false);
        });
      });

      // The visible label IS the native button. Its screen position comes from
      // the marker anchor, avoiding a separate WebGL cursor/hit target.
      AFRAME.registerComponent('audio-label', {
        schema: {
          label: { type: 'string' },
          audio: { type: 'string' },
          marker: { type: 'string' },
          color: { default: '#166534' }
        },
        init: function () {
          this.worldPosition = new THREE.Vector3();
          this.button = document.createElement('button');
          this.button.type = 'button';
          this.button.className = 'audio-label';
          this.button.hidden = true;
          this.button.style.color = this.data.color;
          this.button.setAttribute('aria-label', `Play audio: ${this.data.label}`);
          this.button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>';
          const name = document.createElement('span');
          name.textContent = this.data.label;
          this.button.appendChild(name);
          for (const eventName of ['pointerdown', 'mousedown', 'touchstart']) {
            this.button.addEventListener(eventName, (event) => event.stopPropagation());
          }
          this.button.addEventListener('click', (event) => {
            event.stopPropagation();
            playMarkerAudio(this.data.audio, this.data.marker);
          });
          document.getElementById('labelLayer').appendChild(this.button);
        },
        tick: function () {
          const scene = this.el.sceneEl;
          const camera = scene.camera;
          const canvas = scene.canvas;
          this.button.hidden = true;
          if (!experienceStarted || !trackedMarkers[this.data.marker] || !camera || !canvas) return;
          for (let parent = this.el.object3D; parent; parent = parent.parent) {
            if (!parent.visible) return;
          }
          camera.updateMatrixWorld(true);
          this.el.object3D.getWorldPosition(this.worldPosition);
          this.worldPosition.project(camera);
          const point = this.worldPosition;
          if (![point.x, point.y, point.z].every(Number.isFinite) ||
              point.z < -1 || point.z > 1 || Math.abs(point.x) > 1 || Math.abs(point.y) > 1) return;
          const rect = canvas.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          this.button.style.left = `${rect.left + (point.x + 1) * rect.width / 2}px`;
          this.button.style.top = `${rect.top + (1 - point.y) * rect.height / 2}px`;
          this.button.hidden = false;
        },
        remove: function () {
          if (this.button) this.button.remove();
        }
      });

      // Register the rotation and movement components to all models that need them
      AFRAME.registerComponent('drag-rotate', {
        schema: { speed: { default: 0.15 } },
        init: function () {
          this.isDragging = false;
          this.previousPosition = null;
          // Retain the original component's initial orientation.
          this.rotation = { x: 0, y: 0, z: 0 };
          this.el.setAttribute('rotation', this.rotation);
          const el = this.el;
          const scene = el.sceneEl;

          const start = (x, y) => {
            this.isDragging = true;
            this.previousPosition = { x, y };
          };
          const stop = () => {
            this.isDragging = false;
            this.previousPosition = null;
          };
          const move = (x, y) => {
            if (!this.isDragging || !this.previousPosition) return;
            this.rotation.y -= (x - this.previousPosition.x) * this.data.speed;
            this.rotation.x -= (y - this.previousPosition.y) * this.data.speed;
            el.setAttribute('rotation', this.rotation);
            this.previousPosition = { x, y };
          };

          scene.addEventListener('mousedown', (e) => start(e.clientX, e.clientY));
          scene.addEventListener('mousemove', (e) => move(e.clientX, e.clientY));
          window.addEventListener('mouseup', stop);
          window.addEventListener('blur', stop);
          scene.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) return stop();
            start(e.touches[0].clientX, e.touches[0].clientY);
          });
          scene.addEventListener('touchmove', (e) => {
            if (e.touches.length !== 1) return stop();
            move(e.touches[0].clientX, e.touches[0].clientY);
          });
          scene.addEventListener('touchend', stop);
          scene.addEventListener('touchcancel', stop);
        }
      });

AFRAME.registerComponent('arrow-move', {
  schema: {
    speed: { type: 'number', default: 0.1 }
  },
  init: function () {
    const el = this.el;

    // Keyboard movement
    window.addEventListener('keydown', (e) => {
      const position = el.getAttribute('position');
      if (!position) return;

      switch (e.key) {
        case 'ArrowUp':
          position.y += this.data.speed;
          break;
        case 'ArrowDown':
          position.y -= this.data.speed;
          break;
        case 'ArrowLeft':
          position.x -= this.data.speed;
          break;
        case 'ArrowRight':
          position.x += this.data.speed;
          break;
      }
      el.setAttribute('position', position);
    });
  }
});
    </script>
  </head>

  <body>
    <!-- Start Overlay -->
    <div id="startOverlay">
      <h1>Welcome to Anatomy AR</h1>
      <p>📱 Point your phone at the printed marker</p>
      <p>🌀 Use one finger to rotate the model</p>
      <p>🔊 Tap an organ label to hear its explanation</p>
      <button id="startButton" class="start-button">Tap to Start</button>
    </div>
    <div id="uiPanel" style="position: absolute; top: 10px; left: 10px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;">

    </div>
    
    <div id="labelLayer"></div>
    <p id="audioStatus" role="status" aria-live="polite" style="position: fixed; bottom: 16px; left: 16px; right: 16px; z-index: 9999; color: white; background: #222; padding: 8px; pointer-events: none;" hidden></p>
    <audio id="aortaAudio" src="audio/aorta.mp3" preload="none"></audio>
    <audio id="ventricleAudio" src="audio/ventricle.mp3" preload="none"></audio>
    <audio id="liverAudio" src="audio/liver.mp3" preload="none"></audio>
    <audio id="stomachAudio" src="audio/stomach.mp3" preload="none"></audio>
    <audio id="ribcageAudio" src="audio/ribcage.mp3" preload="none"></audio>

    <!-- Scene -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; cameraParametersUrl: camera_para.dat"
    >
      <a-assets>
        <a-asset-item id="heartModelGLB" src="heart.glb"></a-asset-item>
        <a-asset-item id="bodyGLB" src="body.glb"></a-asset-item>
      </a-assets>
      <!-- Bright ambient light -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 2.5"></a-entity>

      <!-- Directional light to mimic sunlight -->
      <a-entity light="type: directional; color: #ffffff; intensity: 2" position="1 3 2"></a-entity>

      <!-- Camera -->
      <a-entity id="mainCamera" camera></a-entity>

      <!-- Marker 1: Body -->
      <a-marker id="customMarker" type="pattern" preset="custom" url="marker.patt" emitevents="true">
        <a-entity id="markerBody" gltf-model="body.glb" scale="0.06 0.06 0.06" rotation="-90 0 0" visible="false" drag-rotate arrow-move>
          <!-- Labels for Body -->
          <a-entity position="4 1 -8" audio-label="label: Liver; audio: liverAudio; marker: customMarker; color: #166534"></a-entity>
          <a-entity position="-3 0 -8" audio-label="label: Stomach; audio: stomachAudio; marker: customMarker; color: #166534"></a-entity>
          <a-entity position="0 11 -9" audio-label="label: Ribcage; audio: ribcageAudio; marker: customMarker; color: #166534"></a-entity>
        </a-entity>
      </a-marker>

      <!-- Marker 2: Heart -->
      <a-marker id="heartMarker" type="pattern" preset="custom" url="heart-marker.patt" emitevents="true">
        <a-entity id="markerHeart" gltf-model="heart.glb" scale="0.05 0.05 0.05" rotation="-90 0 0" visible="false" drag-rotate arrow-move>
          <a-entity position="3 0 -12" audio-label="label: Aorta; audio: aortaAudio; marker: heartMarker; color: #1d4ed8"></a-entity>
          <a-entity position="0 0 15" audio-label="label: Right Ventricle; audio: ventricleAudio; marker: heartMarker; color: #1d4ed8"></a-entity>
        </a-entity>
      </a-marker>
      
    </a-scene>


  </body>
</html>
